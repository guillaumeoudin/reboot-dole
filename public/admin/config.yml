# Decap CMS — édition des articles du blog.
backend:
  name: github
  repo: guillaumeoudin/reboot-dole
  branch: main
  base_url: https://www.reboot-dole.fr
  auth_endpoint: api/auth
media_folder: "public/uploads"
public_folder: "/uploads"
locale: "fr"

collections:
  - name: "blog"
    label: "Articles de blog"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    fields:
      - name: "title"
        label: "Titre"
        widget: "string"
      - name: "slug"
        label: "URL de l'article"
        widget: "string"
        hint: "C'est la partie qui vient après reboot-dole.fr/blog/ dans l'adresse. Ex : pour reboot-dole.fr/blog/taches-pigmentaires, saisissez juste : taches-pigmentaires — minuscules, tirets à la place des espaces, pas d'accents."
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Minuscules et tirets uniquement, pas d'accents, pas d'URL complète"]
      - name: "date"
        label: "Date de publication"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        hint: "Pré-remplie avec aujourd'hui — modifiez uniquement si la date de publication est différente."
      - name: "author"
        label: "Auteur"
        widget: "string"
        default: "L'équipe Reboot"
        hint: "Pré-rempli avec 'L'équipe Reboot' — laissez tel quel, ou indiquez un prénom si l'article est signé."
      - name: "category"
        label: "Catégorie"
        widget: "select"
        options: ["Soins", "Bien-être", "Actualités"]
        hint: "Choisissez la catégorie la plus proche du sujet de l'article."
      - name: "excerpt"
        label: "Accroche"
        widget: "text"
        hint: "Courte description affichée dans les résultats Google et sur la liste des articles. 160 caractères maximum pour un bon référencement."
      - name: "coverImage"
        label: "Image de couverture"
        widget: "image"
        required: false
        hint: "Optionnel — mais recommandé. Photo principale affichée en haut de l'article et dans les aperçus. Formats acceptés : JPG, PNG."
      - name: "coverAlt"
        label: "Description de l'image"
        widget: "string"
        required: false
        hint: "Optionnel — à remplir si vous avez ajouté une image. Décrivez-la en une phrase, pour l'accessibilité et le référencement. Ex : 'Soin du visage en cabine'."
      - name: "draft"
        label: "Brouillon"
        widget: "boolean"
        default: false
        hint: "Non coché par défaut = l'article est publié dès l'enregistrement. Cochez cette case pour sauvegarder sans publier."
      - name: "body"
        label: "Contenu"
        widget: "markdown"
        hint: "Le contenu complet de l'article. Utilisez la barre d'outils pour mettre en forme le texte (titres, gras, listes…)."
