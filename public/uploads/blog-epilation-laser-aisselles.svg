<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1104" width="1600" height="1104">
  <defs>
    <radialGradient id="bg-laser" cx="50%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#252E50"/>
      <stop offset="100%" stop-color="#1B2240"/>
    </radialGradient>
    <radialGradient id="focal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF60" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#B58B3A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#B58B3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1104" fill="url(#bg-laser)"/>

  <!-- Light rays emanating from focal point (800, 295) -->
  <!-- Central ray: straight down -->
  <line x1="800" y1="295" x2="800"  y2="1104" stroke="#C9A054" stroke-width="2"   opacity="0.65"/>
  <!-- ±18° -->
  <line x1="800" y1="295" x2="1073" y2="1104" stroke="#C9A054" stroke-width="1.6" opacity="0.52"/>
  <line x1="800" y1="295" x2="527"  y2="1104" stroke="#C9A054" stroke-width="1.6" opacity="0.52"/>
  <!-- ±35° -->
  <line x1="800" y1="295" x2="1366" y2="1104" stroke="#C9A054" stroke-width="1.2" opacity="0.38"/>
  <line x1="800" y1="295" x2="234"  y2="1104" stroke="#C9A054" stroke-width="1.2" opacity="0.38"/>
  <!-- ±52° — hit side edges -->
  <line x1="800" y1="295" x2="1600" y2="966"  stroke="#C9A054" stroke-width="0.8" opacity="0.22"/>
  <line x1="800" y1="295" x2="0"    y2="966"  stroke="#C9A054" stroke-width="0.8" opacity="0.22"/>
  <!-- ±65° — shallower, hit side edges higher -->
  <line x1="800" y1="295" x2="1600" y2="703"  stroke="#C9A054" stroke-width="0.5" opacity="0.12"/>
  <line x1="800" y1="295" x2="0"    y2="703"  stroke="#C9A054" stroke-width="0.5" opacity="0.12"/>
  <!-- ±75° — very shallow, almost horizontal -->
  <line x1="800" y1="295" x2="1600" y2="487"  stroke="#C9A054" stroke-width="0.3" opacity="0.07"/>
  <line x1="800" y1="295" x2="0"    y2="487"  stroke="#C9A054" stroke-width="0.3" opacity="0.07"/>

  <!-- Wave-front arcs below focal point -->
  <path d="M 440,660 Q 800,530 1160,660" fill="none" stroke="#B58B3A" stroke-width="1"   opacity="0.28"/>
  <path d="M 240,880 Q 800,720 1360,880" fill="none" stroke="#B58B3A" stroke-width="0.7" opacity="0.16"/>
  <path d="M 120,1020 Q 800,840 1480,1020" fill="none" stroke="#B58B3A" stroke-width="0.5" opacity="0.1"/>

  <!-- Focal glow -->
  <circle cx="800" cy="295" r="130" fill="url(#focal-glow)"/>
  <!-- Hot core -->
  <circle cx="800" cy="295" r="6"  fill="#F0E0A0"/>
  <circle cx="800" cy="295" r="14" fill="none" stroke="#D4AF60" stroke-width="1.8" opacity="0.7"/>
  <circle cx="800" cy="295" r="28" fill="none" stroke="#C9A054" stroke-width="1"   opacity="0.45"/>
  <circle cx="800" cy="295" r="50" fill="none" stroke="#B58B3A" stroke-width="0.6" opacity="0.25"/>
</svg>
