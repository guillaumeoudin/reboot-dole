<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1104" width="1600" height="1104">
  <defs>
    <radialGradient id="bg-cryo" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#21305C"/>
      <stop offset="100%" stop-color="#1B2240"/>
    </radialGradient>
    <!-- Single arm of a snowflake (pointing up) -->
    <g id="arm-cryo">
      <line x1="0" y1="0" x2="0" y2="-260" stroke="#B58B3A" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-75" y1="-80"  x2="75"  y2="-80"  stroke="#B58B3A" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-58" y1="-155" x2="58"  y2="-155" stroke="#B58B3A" stroke-width="1"   stroke-linecap="round"/>
      <line x1="-38" y1="-215" x2="38"  y2="-215" stroke="#B58B3A" stroke-width="0.8" stroke-linecap="round"/>
      <circle cx="-75" cy="-80"  r="3"   fill="#C9A054"/>
      <circle cx="75"  cy="-80"  r="3"   fill="#C9A054"/>
      <circle cx="-58" cy="-155" r="2.5" fill="#C9A054"/>
      <circle cx="58"  cy="-155" r="2.5" fill="#C9A054"/>
      <circle cx="-38" cy="-215" r="2"   fill="#C9A054" opacity="0.7"/>
      <circle cx="38"  cy="-215" r="2"   fill="#C9A054" opacity="0.7"/>
      <circle cx="0"   cy="-260" r="4"   fill="#C9A054"/>
    </g>
  </defs>

  <rect width="1600" height="1104" fill="url(#bg-cryo)"/>

  <!-- Main snowflake at center -->
  <g transform="translate(800, 552)">
    <use href="#arm-cryo" transform="rotate(0)"/>
    <use href="#arm-cryo" transform="rotate(60)"/>
    <use href="#arm-cryo" transform="rotate(120)"/>
    <use href="#arm-cryo" transform="rotate(180)"/>
    <use href="#arm-cryo" transform="rotate(240)"/>
    <use href="#arm-cryo" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="7"  fill="#D4AF60"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#B58B3A" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#B58B3A" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Top-left satellite crystal -->
  <g transform="translate(275, 230) scale(0.32)" opacity="0.4">
    <use href="#arm-cryo" transform="rotate(15)"/>
    <use href="#arm-cryo" transform="rotate(75)"/>
    <use href="#arm-cryo" transform="rotate(135)"/>
    <use href="#arm-cryo" transform="rotate(195)"/>
    <use href="#arm-cryo" transform="rotate(255)"/>
    <use href="#arm-cryo" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="7" fill="#C9A054"/>
  </g>

  <!-- Bottom-right satellite crystal -->
  <g transform="translate(1330, 875) scale(0.26)" opacity="0.32">
    <use href="#arm-cryo" transform="rotate(0)"/>
    <use href="#arm-cryo" transform="rotate(60)"/>
    <use href="#arm-cryo" transform="rotate(120)"/>
    <use href="#arm-cryo" transform="rotate(180)"/>
    <use href="#arm-cryo" transform="rotate(240)"/>
    <use href="#arm-cryo" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="7" fill="#C9A054"/>
  </g>

  <!-- Top-right small crystal -->
  <g transform="translate(1260, 210) scale(0.18)" opacity="0.22">
    <use href="#arm-cryo" transform="rotate(30)"/>
    <use href="#arm-cryo" transform="rotate(90)"/>
    <use href="#arm-cryo" transform="rotate(150)"/>
    <use href="#arm-cryo" transform="rotate(210)"/>
    <use href="#arm-cryo" transform="rotate(270)"/>
    <use href="#arm-cryo" transform="rotate(330)"/>
    <circle cx="0" cy="0" r="7" fill="#C9A054"/>
  </g>

  <!-- Bottom-left small crystal -->
  <g transform="translate(330, 880) scale(0.16)" opacity="0.18">
    <use href="#arm-cryo" transform="rotate(0)"/>
    <use href="#arm-cryo" transform="rotate(60)"/>
    <use href="#arm-cryo" transform="rotate(120)"/>
    <use href="#arm-cryo" transform="rotate(180)"/>
    <use href="#arm-cryo" transform="rotate(240)"/>
    <use href="#arm-cryo" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="7" fill="#C9A054"/>
  </g>

  <!-- Concentric rings around center -->
  <circle cx="800" cy="552" r="330" fill="none" stroke="#B58B3A" stroke-width="0.6" opacity="0.18"/>
  <circle cx="800" cy="552" r="440" fill="none" stroke="#B58B3A" stroke-width="0.4" opacity="0.1"/>
</svg>
